name: Football Value Engine
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: python -m src.engine.cli init
      - run: python -m src.engine.cli ingest
      - run: python -m src.engine.cli train
      - run: python -m src.engine.cli backtest
      - name: Pre-match predictions (goaldir / Bzzoiro API)
        env:
          GOALDIR_API_KEY: ${{ secrets.GOALDIR_API_KEY }}
        run: python -m src.engine.cli predict --today
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: predictions
          path: data/reports/predictions.json
          if-no-files-found: ignore

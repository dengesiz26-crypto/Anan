name: Football Value Engine
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: python -m src.engine.cli init
      - run: python -m src.engine.cli ingest
      - run: python -m src.engine.cli train
      - run: python -m src.engine.cli backtest
